name: CI

# Runs when a pull request into main is opened or reopened, and on every push to a
# branch that has an open pull request (pull_request covers all three by default).
# Lint, type check and tests run only if package.json has a script for them.

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm (version from packageManager in package.json)
        uses: pnpm/action-setup@v6

      - name: Use Node.js 26.x
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run --if-present lint
      - run: pnpm run --if-present typecheck
      - run: pnpm run --if-present test
